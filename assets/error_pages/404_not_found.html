<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <script>
    (function() {
      try {
        if (localStorage.getItem('theme') === 'gruvbox') {
          document.documentElement.setAttribute('data-theme', 'gruvbox');
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 – Not Found</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'Arial'],
            display: ['Space Grotesk', 'ui-sans-serif', 'system-ui']
          },
          colors: {
            ink: '#0B0B0C',
            paper: '#F6F6F7',
            line: '#E6E6E9'
          },
          boxShadow: {
            crisp: '0 1px 0 rgba(0,0,0,0.08), 0 18px 60px rgba(0,0,0,0.06)'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <script src="./assets/js/profile.js" defer></script>
  <script src="./assets/js/base.js" defer></script>
</head>
<body class="bg-paper text-ink antialiased">
  <div class="noise-overlay pointer-events-none fixed inset-0"></div>
  <div class="blob pointer-events-none fixed left-1/2 top-[-60px] h-[320px] w-[320px] -translate-x-1/2 rounded-full"></div>
  <header class="site-header">
    <div class="mx-auto max-w-6xl px-4 py-4 flex items-center justify-between">
      <a class="font-display text-lg" href="/">it’s me <span class="text-xs opacity-60">/ Error</span></a>
      <div class="flex items-center gap-3">
        <a href="/" class="hidden lg:flex profile-chip">
          <div>
            <div class="profile-chip__name" data-bind="name">Dominik Höhr</div>
            <div class="profile-chip__title" data-bind="title"></div>
          </div>
        </a>
      </div>
    </div>
  </header>
  <main class="relative z-10">
    <section class="mx-auto max-w-3xl px-4 pt-12 pb-20">
      <div class="card p-8 text-center">
        <p class="font-display text-6xl">404</p>
        <h1 class="mt-3 font-display text-2xl">Not Found</h1>
        <p class="mt-3 text-sm opacity-75">Die Seite existiert nicht (oder nicht mehr).</p>
        <div class="mt-8 flex flex-wrap justify-center gap-2">
          <a class="btn-ink" href="/">Webseite</a>
          <a class="btn-outline" href="/blog">Blog</a>
          <a id="emailBtn" class="btn-outline" href="mailto:mail@hoehr.net">Kontakt</a>
        </div>
      </div>

      <div class="border-t border-ink/10 px-6 py-5 md:px-10 mt-10">
        <div class="flex flex-wrap items-center justify-center gap-4 text-sm opacity-80 md:justify-center">
          <div class="theme-switcher" role="group" aria-label="Theme switcher">
            <button type="button" class="theme-switcher__btn active" data-theme-toggle="light" aria-pressed="true">☀️ </button>
            <button type="button" class="theme-switcher__btn" data-theme-toggle="gruvbox" aria-pressed="false">🪵 </button>
          </div>
          <p class="text-xs opacity-60">
            <a class="hover:underline" href="/impressum">Impressum</a>
            <a class="hover:underline" href="/datenschutz">Datenschutz</a>
            © <span id="year"></span> <span data-bind="name">Dominik</span>
          </p>
        </div>
      </div>
    </section>
  </main>
  <script>
    (function() {
      var yr = document.getElementById('year');
      if (yr) yr.textContent = String(new Date().getFullYear());
      var toggleBtns = document.querySelectorAll('[data-theme-toggle]');
      if (!toggleBtns.length) return;
      function update(theme) {
        toggleBtns.forEach(function(b) {
          var act = b.getAttribute('data-theme-toggle') === theme;
          b.setAttribute('aria-pressed', act ? 'true' : 'false');
          if (act) b.classList.add('active'); else b.classList.remove('active');
        });
      }
      var cur = (localStorage.getItem('theme') === 'gruvbox') ? 'gruvbox' : 'light';
      update(cur);
      toggleBtns.forEach(function(b) {
        b.addEventListener('click', function(e) {
          e.preventDefault();
          var t = b.getAttribute('data-theme-toggle');
          if (t === 'gruvbox') {
            document.documentElement.setAttribute('data-theme', 'gruvbox');
            try { localStorage.setItem('theme', 'gruvbox'); } catch (e) {}
          } else {
            document.documentElement.removeAttribute('data-theme');
            try { localStorage.setItem('theme', 'light'); } catch (e) {}
          }
          update(t);
        });
      });
    })();
  </script>
</body>
</html>
